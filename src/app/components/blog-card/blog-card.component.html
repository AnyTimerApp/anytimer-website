<a [routerLink]="'/' + post.path" class="blog-card" [ngClass]="'blog-card--' + (post.variant || 'light')">
  <picture style="display: contents">
    <img [src]="post.image" [alt]="post.imageAlt" class="blog-card__thumbnail" loading="lazy">
  </picture>
  <div class="blog-card__body">
    <span class="section-label">{{ post.subCategory || post.category }}</span>
    <h3 class="blog-card__title">{{ post.title }}</h3>
    <p class="blog-card__excerpt">{{ post.excerpt }}</p>
    <div class="blog-card__footer">
      <span class="blog-card__link">Lees meer →</span>
    </div>
  </div>
</a>
