@if (visible) {
<div class="cookie-consent" role="dialog" [attr.aria-label]="ui().cookie.aria">
  <p class="cookie-consent__text">
    {{ ui().cookie.text }}
    {{ ui().cookie.readMore }} <a [routerLink]="ui().paths.privacy">{{ ui().cookie.privacyLink }}</a>.
  </p>
  <div class="cookie-consent__actions">
    <button type="button" class="btn btn-secondary btn-sm" (click)="decline()">{{ ui().cookie.decline }}</button>
    <button type="button" class="btn btn-primary btn-sm" (click)="accept()">{{ ui().cookie.accept }}</button>
  </div>
</div>
}
