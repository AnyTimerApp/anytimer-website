<div class="contact-card">
  <div class="contact-main">
    <div class="contact-icon">
      <picture style="display: contents">
        <source srcset="assets/logo.webp" type="image/webp">
        <img src="assets/logo.png" alt="Anytimer" width="28" height="28" loading="lazy">
      </picture>
    </div>
    <div class="contact-details">
      <strong>Anytimer App</strong>
      <span>{{ ui().cta.free }}</span>
    </div>
  </div>
  <a [routerLink]="ui().paths.home" class="contact-cta">{{ ui().cta.download }}</a>
</div>
