<section class="section team-section" id="team">
  <div class="container">
    <div class="team-header">
      <span class="section-label">{{ t.label }}</span>
      <h2 class="team-title">{{ t.title }}</h2>
      <p class="team-desc">
        {{ t.text }}
      </p>
    </div>

    <div class="team-grid">
      @for (member of members; track member.name) {
      <div class="member-card">
        <div class="member-avatar">
          <picture>
            <source [srcset]="member.webp" type="image/webp" />
            <img [src]="member.png" [alt]="member.name" />
          </picture>
        </div>
        <h3>{{ member.name }}</h3>
        <p>{{ member.role }}</p>
      </div>
      }
    </div>

    <div class="team-cta">
      <p>{{ t.question }}</p>
      <a [routerLink]="ui.paths.contact" class="btn btn-secondary">{{ t.contact }}</a>
    </div>
  </div>
</section>
